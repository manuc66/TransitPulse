<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TransitPulse</title>
  <style>
    :root { --bg:#0f1115; --card:#1a1d24; --muted:#8b93a1; --fg:#e7eaf0; --accent:#3b82f6; }
    * { box-sizing: border-box; }
    body { margin:0; font:16px/1.5 system-ui, sans-serif; background:var(--bg); color:var(--fg); }
    header { padding:24px 16px 8px; max-width:760px; margin:0 auto; }
    h1 { margin:0 0 4px; font-size:1.4rem; }
    .sub { color:var(--muted); font-size:.9rem; }
    main { max-width:760px; margin:0 auto; padding:16px; }
    form { display:flex; gap:8px; margin:16px 0; }
    input { flex:1; min-width:0; padding:12px 14px; border-radius:10px; border:1px solid #2a2f3a; background:var(--card); color:var(--fg); font-size:1rem; }
    button { padding:12px 16px; border-radius:10px; border:0; background:var(--accent); color:#fff; font-size:1rem; cursor:pointer; white-space:nowrap; }
    button.ghost { background:#2a2f3a; color:var(--fg); }
    button:disabled { opacity:.5; cursor:default; }
    .hint { color:var(--muted); font-size:.85rem; }
    .results { list-style:none; padding:0; margin:12px 0; }
    .results li { background:var(--card); border-radius:10px; padding:10px 12px; margin:6px 0; cursor:pointer; display:flex; justify-content:space-between; gap:8px; align-items:center; }
    .results li:hover { outline:1px solid var(--accent); }
    .results .dist { color:var(--muted); font-size:.8rem; }
    .stop { margin-top:20px; }
    .stop h2 { font-size:1.1rem; margin:0 0 2px; }
    .feed { display:flex; align-items:center; gap:8px; color:var(--muted); font-size:.8rem; margin-bottom:14px; }
    .dot { width:8px; height:8px; border-radius:50%; background:#22c55e; animation:pulse 2s infinite; }
    .dot.stale { background:#ef4444; animation:none; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }
    .line { background:var(--card); border-radius:12px; padding:14px; margin:10px 0; border-left:5px solid var(--muted); }
    .line-head { display:flex; align-items:center; gap:10px; }
    .badge { min-width:30px; height:30px; padding:0 6px; border-radius:8px; display:grid; place-items:center; font-weight:700; background:#2a2f3a; }
    .line-name { font-weight:600; font-size:.95rem; }
    .status { margin-left:auto; font-size:.85rem; padding:4px 10px; border-radius:999px; font-weight:600; }
    .reason { color:var(--muted); font-size:.85rem; margin-top:6px; }
    .basis { margin-top:8px; font-size:.85rem; color:#cbd5e1; }
    .evidence { list-style:none; padding:0; margin:6px 0 0; display:flex; flex-wrap:wrap; gap:6px; }
    .evidence li { font-size:.78rem; padding:3px 9px; border-radius:999px; background:#232833; color:#cbd5e1; }
    .evidence li.ev-data_fresh { background:#14532d; color:#86efac; }
    .evidence li.ev-data_stale { background:#7f1d1d; color:#fca5a5; }
    .evidence li.ev-cancelled { background:#7c2d12; color:#fdba74; }
    .evidence li.ev-no_service_alert { background:#7f1d1d; color:#fca5a5; }
    .evidence li.ev-delay { background:#78350f; color:#fdba74; }
    .evidence li.ev-on_time { background:#14532d; color:#86efac; }
    .evidence li.ev-no_scheduled_service { background:#374151; color:#d1d5db; }
    table { width:100%; border-collapse:collapse; margin-top:10px; font-size:.9rem; }
    th,td { text-align:left; padding:4px 6px; border-bottom:1px solid #232833; }
    th { color:var(--muted); font-weight:500; }
    .advice { margin-top:16px; padding:12px 14px; border-radius:10px; background:#1e2430; font-weight:600; }
    .normal{background:#14532d;color:#86efac} .perturbed{background:#78350f;color:#fdba74}
    .reduced{background:#7c2d12;color:#fdba74} .stopped{background:#7f1d1d;color:#fca5a5}
    .unknown{background:#374151;color:#d1d5db}
    .s-normal{border-left-color:#22c55e} .s-perturbed{border-left-color:#f59e0b}
    .s-reduced{border-left-color:#f97316} .s-stopped{border-left-color:#ef4444}
    .s-unknown{border-left-color:#6b7280}
    .err { color:#fca5a5; }
    .flash { animation:flash 1s; } @keyframes flash { from{background:#1e2b3f} to{background:var(--card)} }
  </style>
</head>
<body>
  <header>
    <h1>TransitPulse</h1>
    <div class="sub">Les bus circulent-ils comme prévu dans ma rue, maintenant&nbsp;?</div>
  </header>
  <main>
    <form id="search">
      <input id="q" placeholder="Rue, adresse ou arrêt (ex. Guillemins, Sclessin…)" autocomplete="off" />
      <button>Chercher</button>
      <button type="button" id="geo" class="ghost" title="Utiliser ma position">Ma position</button>
    </form>
    <div class="hint" id="hint">Tapez un arrêt ou utilisez votre position. Mise à jour automatique en direct.</div>
    <ul id="choices" class="results"></ul>
    <div id="results"></div>
  </main>

  <script>
    const LABEL = { normal:"Normal", perturbed:"Perturbé", reduced:"Réduit", stopped:"À l'arrêt", unknown:"Inconnu" };
    const fmt = iso => new Date(iso).toLocaleTimeString("fr-BE", { hour:"2-digit", minute:"2-digit" });
    const $ = id => document.getElementById(id);

    let ws = null;
    let currentStop = null;

    // --- Recherche d'arrêts ---
    $("search").addEventListener("submit", async (e) => {
      e.preventDefault();
      const q = $("q").value.trim();
      if (!q) return;
      try {
        const stops = await (await fetch(`/api/search?q=${encodeURIComponent(q)}`)).json();
        renderChoices(stops);
      } catch (err) { showError(err); }
    });

    // --- Géolocalisation navigateur ---
    $("geo").addEventListener("click", () => {
      if (!navigator.geolocation) { $("hint").textContent = "Géolocalisation non supportée par le navigateur."; return; }
      $("geo").disabled = true;
      $("hint").textContent = "Localisation en cours…";
      navigator.geolocation.getCurrentPosition(
        async (pos) => {
          const { latitude: lat, longitude: lon } = pos.coords;
          try {
            const stops = await (await fetch(`/api/nearby?lat=${lat}&lon=${lon}&radius=800`)).json();
            renderChoices(stops, { nearby: true });
            if (stops.length) selectStop(stops[0].stop_id, stops[0].name);
            else $("hint").textContent = "Aucun arrêt dans un rayon de 800 m.";
          } catch (err) { showError(err); }
          finally { $("geo").disabled = false; }
        },
        (err) => { $("geo").disabled = false; $("hint").textContent = `Localisation refusée : ${err.message}`; },
        { enableHighAccuracy: true, timeout: 10000, maximumAge: 60000 }
      );
    });

    function renderChoices(stops, opts = {}) {
      const ul = $("choices"); ul.innerHTML = "";
      if (!stops.length) { $("hint").textContent = "Aucun arrêt trouvé."; return; }
      $("hint").textContent = `${stops.length} arrêt(s) — cliquez pour suivre en direct.`;
      for (const s of stops) {
        const li = document.createElement("li");
        const dist = (s.metres != null) ? `<span class="dist">${Math.round(s.metres)} m</span>`
                    : (opts.nearby ? "" : "");
        li.innerHTML = `<span>${escapeHtml(s.name)}</span>${dist}`;
        li.addEventListener("click", () => selectStop(s.stop_id, s.name));
        ul.appendChild(li);
      }
    }

    // --- Sélection d'un arrêt + WebSocket live ---
    function selectStop(stopId, name) {
      currentStop = stopId;
      $("choices").innerHTML = "";
      $("hint").textContent = `Suivi en direct : ${name}`;
      connectLive(stopId);
    }

    function connectLive(stopId) {
      if (ws) { ws.onclose = null; ws.close(); }
      const proto = location.protocol === "https:" ? "wss" : "ws";
      ws = new WebSocket(`${proto}://${location.host}/api/live?stop=${encodeURIComponent(stopId)}`);
      ws.onmessage = (ev) => {
        const msg = JSON.parse(ev.data);
        if (msg.type === "status") renderStop(msg.status);
        else if (msg.type === "error") showError(new Error(msg.message));
      };
      ws.onerror = () => showError(new Error("Connexion temps réel interrompue."));
      ws.onclose = () => { /* reconnexion gérée au prochain selectStop */ };
    }

    function renderStop(st) {
      if (currentStop && st.stop.stop_id !== currentStop) return;
      const box = $("results");
      const fresh = st.feed_age_secs != null && st.feed_age_secs < 120;
      const maj = st.last_updated
        ? `il y a ${st.feed_age_secs ?? "?"} s (${fmt(st.last_updated)})`
        : "mise à jour inconnue";
      box.innerHTML = "";
      const el = document.createElement("div");
      el.className = "stop";
      el.innerHTML = `<h2>${escapeHtml(st.stop.name)}</h2>
        <div class="feed"><span class="dot ${fresh ? "" : "stale"}"></span>${maj}</div>`;
      for (const l of st.lines) {
        const rows = l.departures.map(d => {
          const obs = d.cancelled ? "annulé" : (d.observed ? fmt(d.observed) : "—");
          let deltaTxt = "—";
          if (!d.cancelled && d.observed) {
            const delta = Math.round((new Date(d.observed) - new Date(d.scheduled)) / 60000);
            deltaTxt = delta > 0 ? `+${delta} min` : (delta < 0 ? `${delta} min` : "à l'heure");
          }
          return `<tr><td>${l.line.short_name}</td><td>${escapeHtml(d.headsign)}</td>
                  <td>${fmt(d.scheduled)}</td><td>${obs}</td><td>${deltaTxt}</td></tr>`;
        }).join("");
        const div = document.createElement("div");
        div.className = `line s-${l.status}`;
        div.innerHTML = `
          <div class="line-head">
            <div class="badge">${escapeHtml(l.line.short_name)}</div>
            <div class="line-name">${escapeHtml(l.line.long_name)}</div>
            <span class="status ${l.status}">${LABEL[l.status]}</span>
          </div>
          ${l.reason ? `<div class="reason">${escapeHtml(l.reason)}</div>` : ""}
          <div class="basis">Pourquoi&nbsp;: ${escapeHtml(l.basis || "—")}</div>
          ${(l.evidence && l.evidence.length)
            ? `<ul class="evidence">${l.evidence.map(e => `<li class="ev-${e.kind}">${escapeHtml(e.detail)}</li>`).join("")}</ul>`
            : ""}
          <table>
            <thead><tr><th>Ligne</th><th>Direction</th><th>Prévu</th><th>Observé</th><th>Écart</th></tr></thead>
            <tbody>${rows}</tbody>
          </table>`;
        el.appendChild(div);
      }
      const advice = document.createElement("div");
      advice.className = "advice";
      advice.textContent = st.advice;
      el.appendChild(advice);
      box.appendChild(el);
      // Petit flash à chaque mise à jour.
      el.classList.add("flash");
      setTimeout(() => el.classList.remove("flash"), 1000);
    }

    function showError(err) {
      $("results").innerHTML = `<p class="err">Erreur : ${escapeHtml(err.message)}</p>`;
    }
    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
    }
  </script>
</body>
</html>
